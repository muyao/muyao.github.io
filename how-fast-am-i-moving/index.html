<!DOCTYPE html>

<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>How fast am I moving?</title>
	<link rel="stylesheet" href="/style-global.css">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header>
		<div class="header-container">
			<h1>Speed Tracker</h1>
			<span class="header-extras">
				<i>Track your speed based on GPS location</i>
			</span>
		</div>
		<hr>
	</header>
	<main>
		<div>
			<div class="info-container-row">
				<div class="info-container">
					<span class="info-label">Estimated Speed:</span>
					<span class="info-display">
						<span id="speed">-</span>
					</span>
				</div>
				<span class="info-unit" id="speed-unit">km/h</span>
			</div>
			<div class="info-container-row">
				<div class="info-container">
					<span class="info-label">Altitude:</span>
					<span class="info-display">
						<span id="altitude">-</span>
					</span>
				</div>
				<span class="info-unit" id="altitude-unit">m</span>
			</div>
			<div class="info-container-row">
				<div class="info-container">
					<span class="info-label">T+ Last Measure:</span>
					<span class="info-display">
						<span id="tplus">-</span>
					</span>
				</div>
				<span class="info-unit">s</span>
			</div>
			<div class="info-container-row">
				<div class="info-container">
					<span class="info-label">Accuracy:</span>
					<span class="info-display">
						<span id="acc">-</span>
					</span>
				</div>
				<span class="info-unit" id="acc-unit">m</span>
			</div>
		</div>
		<div class="buttons-container">
			<div class="buttons-row">
				<span class="clickable" id="start">Start measuring</span>
			</div>
			<div class="buttons-row">
				<span class="clickable" id="change-units">Change units</span>
			</div>
			<div class="buttons-row">
				<span class="clickable" id="reset">Reset</span>
			</div>
		</div>
		<div class="note" id="note" hidden>
			<span>
				No speed data available. Estimating by GPS coordinates instead. Speed may be inaccurate
			</span>
		</div>
	</main>
	<script src="main.js"></script>
</body>

</html>
